  { name: 'Elon Park Elementary School', type: 'School', area: 'Charlotte, NC' },
  { name: 'Rea Farms STEAM Academy', type: 'School', area: 'Charlotte, NC' },
];

// Add events: { title, date: 'Month D, YYYY', place, type: 'USTA Junior Tournament', link: 'https://...' }
const EVENTS = [];
const EVENT_TYPES = [
  ['USTA Junior Tournaments', 'Sanctioned play that gives players a chance to compete and grow.'],
  ['Tennis Competitions', 'Friendly, program-based competitions that make learning fun.'],

];
/* ================================================== */

const NAV = [['about','About'],['programs','Programs'],['why','Why CTR'],['locations','Locations'],['events','Events'],['contact','Contact']];

function Reveal({ children, className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!('IntersectionObserver' in window)) { el.classList.add('in'); return; }
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { el.classList.add('in'); io.disconnect(); } }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return html`<div ref=${ref} className=${'reveal ' + className}>${children}</div>`;
}

function Button({ href, variant = 'primary', children, external, className = '' }) {
  const styles = {
    primary: 'bg-optic text-navy hover:bg-white',
    outline: 'border-2 border-white/80 text-white hover:bg-white hover:text-navy',
    green: 'bg-court text-white hover:bg-navy',
  }[variant];
  const ext = external ? { target: '_blank', rel: 'noopener noreferrer' } : {};
  return html`<a href=${href} ...${ext} className=${'inline-flex items-center justify-center rounded-full px-7 py-3.5 font-semibold transition-colors text-center ' + styles + ' ' + className}>${children}</a>`;
}

function Section({ id, alt, title, kicker, children }) {
  return html`<section id=${id} className="py-20 md:py-28" style=${{ background: alt ? 'var(--alt)' : 'var(--bg)' }}>
    <div className="mx-auto max-w-6xl px-5">
      <${Reveal}>
        ${kicker && html`<p className="mb-2 font-semibold uppercase tracking-widest text-court" style=${{ color: 'var(--muted)' }}>${kicker}</p>`}
        <h2 className="font-display text-4xl font-extrabold uppercase leading-none md:text-6xl">${title}</h2>
      <//>
      <div className="mt-10">${children}</div>
    </div>
  </section>`;
}

function Header() {

      <a href="#top" className="flex items-center gap-3 font-display text-lg font-extrabold uppercase leading-none tracking-wide text-white sm:text-xl"><img src=${LOGO} width="48" height="48" alt="Charlotte Tennis Revolution logo" className="h-12 w-12 rounded-full ring-2 ring-white/80"/><span>Charlotte Tennis <span className="text-optic">Revolution</span></span></a>
      <nav aria-label="Main" className="hidden items-center gap-6 md:flex">

      </nav>
      <button className="text-white md:hidden" aria-label="Menu" aria-expanded=${open} onClick=${() => setOpen(!open)}>

      </button>
    </div>
    ${open && html`<nav aria-label="Mobile" className="flex flex-col gap-1 bg-navy px-5 pb-5 md:hidden">
      ${NAV.map(([id, l]) => html`<a key=${id} href=${'#' + id} onClick=${() => setOpen(false)} className="py-2.5 text-lg text-white/90">${l}</a>`)}
      <${Button} href=${REGISTER_URL} external className="mt-2">Register Now<//>
    </nav>`}
  </header>`;
}

}

function Hero() {

        </div>

    </div>
  </section>`;

    <//>
  <//>`;
}

    <//>

    </div>
  </footer>`;

function App() {
  return html`<main><${Header} /><${Hero} /><${About} /><${Programs} /><${Why} /><${Locations} /><${Events} /><${CTA} /><${Contact} /></main>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
